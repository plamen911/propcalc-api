security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    # Only the *first* matching access control is used, so these run narrowest first:
    # the public endpoints, then the calculator's one read into the admin namespace,
    # then the three admin prefixes, then the catch-all.
    #
    # Every path here is a regular expression and is anchored with $ where an exact
    # match is meant. An unanchored prefix silently covers every path below it - that is
    # how /tariff/pdf/email became an unauthenticated way to make the service send mail.
    access_control:
        # -- Public: reachable with no token at all ---------------------------------
        - { path: ^/api/v1/auth/anonymous$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/admin/auth/login$, roles: PUBLIC_ACCESS }
        # Exact path only. The /email variant below it needs a token (any role).
        - { path: ^/api/v1/tariff/pdf$, roles: PUBLIC_ACCESS }

        # -- The public calculator's one read out of the admin namespace ------------
        # propcalc-client's covered-risks step reads the tariff catalogue with an
        # anonymous token. The payload is the public price list, not admin data.
        # /api/v1/form-data/tariff-presets serves the same response under a public
        # name; once the client has moved to it, delete this rule.
        - { path: ^/api/v1/insurance-policies/admin/tariff-presets$, methods: [GET], roles: IS_AUTHENTICATED_FULLY }

        # -- Admin: ROLE_ADMIN, not merely a valid token ----------------------------
        # The admin surface is spread over three unrelated prefixes; all three are
        # listed, and each admin controller repeats the check with #[IsGranted].
        - { path: ^/api/v1/insurance-policies/admin, roles: ROLE_ADMIN }
        - { path: ^/api/v1/app-configs/admin, roles: ROLE_ADMIN }
        - { path: ^/api/v1/admin, roles: ROLE_ADMIN }

        # -- Everything else: any authenticated caller, anonymous tokens included ---
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
